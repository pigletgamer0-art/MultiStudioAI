name: Build MultiAI Android APK

on:
  push:
    branches: [ android-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reassemble base project
        run: |
          cat chunks/part_* > project.b64
          base64 -d project.b64 > MultiAI_Android_base.zip
          mkdir -p buildsrc
          unzip -q MultiAI_Android_base.zip -d buildsrc
      - name: Apply v0.2 UI patch
        run: |
          cat ui_patch/part_* > ui.patch
          patch buildsrc/MultiAI_Android/app/src/main/assets/index.html < ui.patch
          sed -i "s/versionCode 1/versionCode 2/" buildsrc/MultiAI_Android/app/build.gradle
          sed -i "s/versionName '0.1.0'/versionName '0.2.0'/" buildsrc/MultiAI_Android/app/build.gradle
      - name: Build debug APK
        working-directory: buildsrc/MultiAI_Android
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiAI-v0.2-debug-apk
          path: buildsrc/MultiAI_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
