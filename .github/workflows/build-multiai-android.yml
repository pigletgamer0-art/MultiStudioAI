name: Build MultiAI Android APK

on:
  push:
    branches: [ android-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reassemble base project
        run: |
          cat chunks/part_* > base.b64
          base64 -d base.b64 > base.zip
          mkdir -p buildsrc
          unzip -q base.zip -d buildsrc

      - name: Apply MultiAI v0.3 files
        run: |
          cat v03/part_* > overlay.b64
          base64 -d overlay.b64 > overlay.tar.gz
          tar -xzf overlay.tar.gz -C buildsrc/MultiAI_Android

      - name: Apply verified MultiAI v0.4 files
        run: |
          cat v04fresh/part_* > overlay-v04.b64
          base64 -d overlay-v04.b64 > overlay-v04.tar.gz
          echo '08484169e92d3d3975aec3d4e24f23245041184b3d10140e955ea72769098e3d  overlay-v04.tar.gz' | sha256sum -c -
          tar -xzf overlay-v04.tar.gz -C buildsrc/MultiAI_Android

      - name: Apply MultiAI v0.5 alpha
        run: |
          cp v05/v05.js buildsrc/MultiAI_Android/app/src/main/assets/v05.js
          python - <<'PY'
          from pathlib import Path
          p=Path('buildsrc/MultiAI_Android/app/src/main/assets/index.html')
          s=p.read_text()
          s=s.replace('<script src="https://js.puter.com/v2/"></script>','')
          s=s.replace('</body>','<script src="v05.js"></script>\n</body>')
          s=s.replace('.auth-error{color:#fda4af;text-align:center;font-size:12px;margin-top:10px}', '.auth-error{color:#fda4af;text-align:center;font-size:12px;margin-top:10px}.auth-actions{display:grid;gap:10px;margin-top:18px}.auth-secondary{width:100%;border:1px solid #343434;border-radius:18px;padding:14px;background:#232323;color:#fff;font-weight:700}.auth-secondary.google{background:#fff;color:#111}.auth-link{background:transparent;border:0;color:#aaa;padding:10px}.auth-form{display:none;gap:10px;margin-top:14px}.auth-form.show{display:grid}.auth-form input{width:100%;border:1px solid #383838;border-radius:14px;background:#0d0d0d;color:#fff;padding:13px;outline:none}.plan-badge{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:5px 9px;border-radius:999px;background:#ffffff10;color:#d7d7d7;font-size:12px}.plan-badge.plus{background:linear-gradient(90deg,#7c3aed44,#06b6d444);color:#fff;border:1px solid #8b5cf666}')
          p.write_text(s)
          b=Path('buildsrc/MultiAI_Android/app/build.gradle')
          t=b.read_text().replace('versionCode 4','versionCode 5').replace("versionName '0.4.0'","versionName '0.5.0-alpha'")
          b.write_text(t)
          PY

      - name: Apply MultiAI v0.5.1 account fixes
        run: |
          python v051/apply.py buildsrc/MultiAI_Android

      - name: Apply MultiAI v0.5.2 account hotfix
        run: |
          cp v052/v052.js buildsrc/MultiAI_Android/app/src/main/assets/v052.js
          python - <<'PY'
          from pathlib import Path
          p=Path('buildsrc/MultiAI_Android/app/src/main/assets/index.html')
          s=p.read_text()
          s=s.replace('</body>','<script src="v052.js"></script>\n</body>')
          s=s.replace('.auth-gate{position:fixed;inset:0;z-index:9999;background:#050505;display:none;align-items:center;justify-content:center;padding:28px;overflow:hidden}', '.auth-gate{position:fixed;inset:0;z-index:9999;background:#050505;display:none;align-items:flex-start;justify-content:center;padding:calc(22px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}')
          s=s.replace('MultiAI v0.5.1 alpha','MultiAI v0.5.2 alpha')
          p.write_text(s)
          b=Path('buildsrc/MultiAI_Android/app/build.gradle')
          t=b.read_text().replace('versionCode 6','versionCode 7').replace("versionName '0.5.1-alpha'","versionName '0.5.2-alpha'")
          b.write_text(t)
          PY

      - name: Apply MultiAI v0.5.3 legacy auth fix
        run: |
          python - <<'PY'
          from pathlib import Path
          b=Path('buildsrc/MultiAI_Android/app/build.gradle')
          t=b.read_text().replace('versionCode 7','versionCode 8').replace("versionName '0.5.2-alpha'","versionName '0.5.3-alpha'")
          b.write_text(t)
          p=Path('buildsrc/MultiAI_Android/app/src/main/assets/index.html')
          s=p.read_text().replace('MultiAI v0.5.2 alpha','MultiAI v0.5.3 alpha')
          p.write_text(s)
          PY
          grep -n "versionName" buildsrc/MultiAI_Android/app/build.gradle
          grep -n "Configura el servidor MultiAI en Ajustes > Seguridad o entra como invitado" buildsrc/MultiAI_Android/app/src/main/assets/v05.js && exit 1 || true
          grep -n "V05_localRegister" buildsrc/MultiAI_Android/app/src/main/assets/v05.js

      - name: Build debug APK
        working-directory: buildsrc/MultiAI_Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiAI-v0.5.3-alpha-debug-apk
          path: buildsrc/MultiAI_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
